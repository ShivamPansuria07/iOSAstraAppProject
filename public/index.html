<!DOCTYPE html>
<html>
<head>
    <title>Vita - Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Welcome to Vita!</h2>
        <p>Redirecting you back to the app...</p>
        <p><small>If you're not redirected automatically, <a href="vita://" style="color: #ffd700;">click here</a></small></p>
    </div>

    <script>
        // Extract the access token from the URL
        const urlParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = urlParams.get('access_token');
        
        if (accessToken) {
            console.log('OAuth successful! Access token received.');
            
            // Store the token temporarily
            localStorage.setItem('vita_oauth_token', accessToken);
            
            // Try to redirect to the Vita app immediately
            try {
                window.location.href = 'vita://auth/callback?token=' + encodeURIComponent(accessToken);
            } catch (e) {
                console.log('Direct redirect failed, trying fallback');
                // Fallback: redirect after delay
                setTimeout(() => {
                    window.location.href = 'vita://auth/callback?token=' + encodeURIComponent(accessToken);
                }, 1000);
            }
        } else {
            console.log('No access token found in URL');
            // Still try to redirect to the app
            setTimeout(() => {
                window.location.href = 'vita://';
            }, 1000);
        }
    </script>
</body>
</html>
